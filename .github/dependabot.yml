version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "preview"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "com.android.application"
        versions: ["[9.5.0,)"]
      - dependency-name: "com.android.tools.build:gradle"
        versions: ["[9.5.0,)"]
