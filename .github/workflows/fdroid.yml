name: F-Droid Build

on:
  push:
    branches:
      - main
      - preview
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fdroid:
    name: Build fdroid APK without GMS or Firebase
    runs-on: ubuntu-latest
    if: github.event.action != 'edited' || github.event.changes.base != null
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove google-services.json files listed in the F-Droid metadata
        run: |
          rm -f app/src/gmsDebug/google-services.json
          rm -f app/src/gmsRelease/google-services.json
          rm -f app/src/gmsLocalDebug/google-services.json
          rm -f app/src/standardGmsDebug/google-services.json
          rm -f app/src/standardGmsRelease/google-services.json
          rm -f app/src/standardGmsLocalDebug/google-services.json
          rm -f app/src/fdroidGmsDebug/google-services.json
          rm -f app/src/fdroidGmsRelease/google-services.json
          rm -f app/src/fdroidGmsLocalDebug/google-services.json

      - name: Build fdroid release APK
        run: |
          ./gradlew --no-daemon :app:assembleFdroidNogmsRelease

      - name: Verify the fdroid dependency graph has no GMS, Firebase or JitPack libraries
        run: |
          ./gradlew --no-daemon --offline :app:dependencies --configuration fdroidNogmsReleaseRuntimeClasspath > fdroid-dependencies.txt
          if grep -E "com\.google\.firebase|com\.google\.android\.gms|com\.google\.android\.libraries\.identity|play-services|com\.github\.jeziellago|compose-markdown" fdroid-dependencies.txt; then
            echo "::error::The fdroid variant depends on GMS, Firebase or JitPack libraries."
            exit 1
          fi

      - name: Verify the generated license catalog is included
        run: |
          CATALOG=app/build/generated/licenses/fdroidNogmsRelease/com/karasu256/karasulab/data/GeneratedLicenseCatalog.kt
          test -s "$CATALOG"
          grep -q "Karasu Lab Android" "$CATALOG"
          grep -q "MIT License" "$CATALOG"

      - name: Verify the APK package name and version
        run: |
          BASE_VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          IFS='.' read -r V_MAJOR V_MINOR V_PATCH <<< "$BASE_VERSION"
          VERSION_CODE=$((2000000000 + COMMIT_COUNT * 1000 + (V_MAJOR * 10000 + V_MINOR * 100 + V_PATCH) % 1000))
          VERSION_NAME="${BASE_VERSION}-fdroidNogmsRelease-${SHORT_SHA}+${VERSION_CODE}"
          AAPT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/37.0.0/aapt"
          APK=$(ls app/build/outputs/apk/fdroidNogms/release/*.apk | head -n1)
          BADGING=$("$AAPT" dump badging "$APK")
          grep -q "package: name='com.karasu256.karasulab.fdroid'" <<< "$BADGING"
          grep -q "versionCode='${VERSION_CODE}'" <<< "$BADGING"
          grep -q "versionName='${VERSION_NAME}'" <<< "$BADGING"

      - name: Verify APK signatures
        run: |
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
          for APK in app/build/outputs/apk/fdroidNogms/release/*.apk; do
            set +e
            "$APKSIGNER" verify --print-certs -v "$APK"
            set -e
          done >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fdroid APK
        uses: actions/upload-artifact@v7
        with:
          name: android-fdroid-${{ github.sha }}
          path: |
            app/build/outputs/apk/fdroidNogms/release/*.apk
          if-no-files-found: error
          retention-days: 14
