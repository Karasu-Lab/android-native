name: Android Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare signing key
        env:
          PLAYSTORE_SIGNING_ALIAS: ${{ vars.PLAYSTORE_SIGNING_ALIAS }}
          PLAYSTORE_SIGNING_PASS: ${{ secrets.PLAYSTORE_SIGNING_PASS }}
        run: |
          tr -d ' \n\r' <<< '${{ secrets.SIGNING_KEY_BASE64 || secrets.SIGNING_KEY }}' | base64 -d > ./.keystore
          STORE_PASS=$(tr -d '\n\r' <<< "$PLAYSTORE_SIGNING_PASS")
          KEY_ALIAS=$(tr -d '\n\r' <<< "$PLAYSTORE_SIGNING_ALIAS")
          if ! keytool -list -keystore ./.keystore -storepass "${STORE_PASS}" > /dev/null 2>&1; then
            echo "::error::The signing key could not be opened with the repository secret PLAYSTORE_SIGNING_PASS."
            exit 1
          fi
          if ! keytool -list -keystore ./.keystore -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}" > /dev/null 2>&1; then
            echo "::error::The alias '${KEY_ALIAS}' from the repository variable PLAYSTORE_SIGNING_ALIAS was not found in the signing key."
            exit 1
          fi
          {
            echo "signing.storePassword=${STORE_PASS}"
            echo "signing.keyPassword=${STORE_PASS}"
            echo "signing.Alias=${KEY_ALIAS}"
          } > ./local.properties
          keytool -list -v -keystore ./.keystore -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}"

      - name: Compute version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          SHORT_SHA=$(git rev-parse --short HEAD)
          {
            echo "version_name=${BASE_VERSION}-${SHORT_SHA}"
            echo "version_code=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --channel=3 --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew --no-daemon :app:assembleGmsDebug \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" -Pdebuggable=false

      - name: Verify APK signature
        run: |
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
          APK=$(ls app/build/outputs/apk/gms/debug/*.apk | head -n1)
          REPORT=app/build/outputs/apk/gms/debug/apksigner-report.txt
          set +e
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$REPORT" 2>&1
          STATUS=$?
          set -e
          {
            echo "## APK signature verification"
            echo '```'
            cat "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-signed-${{ github.sha }}
          path: |
            app/build/outputs/apk/gms/debug/*.apk
          if-no-files-found: error
          retention-days: 14
