name: Android Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-signed:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Prepare Android signing key
        env:
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          tr -d ' \n\r' <<< '${{ secrets.SIGNING_KEY }}' | base64 -d | gpg --decrypt --batch --passphrase "${SIGNING_PASS}" > ./.keystore
          {
            echo "signing.storePassword=${SIGNING_PASS}"
            echo "signing.keyPassword=${SIGNING_PASS}"
            echo "signing.keyAlias=release"
          } > ./local.properties
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK and AAB
        env:
          SIGNING_KEY: ${{ runner.temp }}/android-release.jks
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-signed-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  android-unsigned:
    name: Build unsigned release APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK and AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload unsigned release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  google-play-release:
    name: Release to Google Play
    needs: android-signed
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Download signed release bundle
        uses: actions/download-artifact@v4
        with:
          name: android-release-signed-${{ github.sha }}
          path: app/build/outputs/bundle/release/
      - name: Decode Google Play Service Account Key
        env:
          IAM_PRIVATE_KEY: ${{ secrets.IAM_PRIVATE_KEY }}
        run: |
          tr -d ' \n\r' <<< '${{ secrets.IAM_PRIVATE_KEY }}' | base64 -d > ./service-account.json
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          service-account-json: ./service-account.json
          package-name: ${{ secrets.PACKAGE_NAME }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event_name == 'pull_request' && 'internal' || 'production' }}
