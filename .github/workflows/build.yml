name: Android Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-signed:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Prepare Android signing key
        env:
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          tr -d ' \n\r' <<< '${{ secrets.SIGNING_KEY }}' | base64 -d > ./.keystore
          echo "signing.storePassword=$SIGNING_PASS" >> ./local.properties
          echo "signing.keyPassword=$SIGNING_PASS" >> ./local.properties
          echo "signing.keyAlias=release" >> ./local.properties
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK and AAB
        env:
          SIGNING_KEY: ${{ runner.temp }}/android-release.jks
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-signed-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  android-unsigned:
    name: Build unsigned release APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK and AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload unsigned release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
