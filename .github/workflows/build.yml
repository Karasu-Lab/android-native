name: Android Build

on:
  push:
    branches:
      - main
      - preview
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-pr-source:
    name: Validate pull request source for main
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == github.event.repository.default_branch
    steps:
      - name: Require the preview branch as the source
        run: |
          if [ "$GITHUB_HEAD_REF" != "preview" ]; then
            echo "::error::Pull requests to the default branch must come from the preview branch."
            exit 1
          fi

  release_please:
    name: Compute build version
    runs-on: ubuntu-latest
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      github.ref == 'refs/heads/preview')) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'release-please--') &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease: pending'))
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Compute build version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          SHORT_SHA=$(git rev-parse --short HEAD)
          {
            echo "base_version=${BASE_VERSION}"
            echo "version_name=${BASE_VERSION}-${SHORT_SHA}"
            echo "version_code=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

  signing:
    name: Check signing configuration
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/preview') && 'preview' || 'production' }}
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check signing key
        id: check
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ] || [ -n "$SIGNING_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing key is available for this run. The signed build and the Google Play upload will be skipped."
          fi

  android-signed:
    name: Build signed APK and AAB
    needs:
      - release_please
      - signing
    runs-on: ubuntu-latest
    if: >-
      needs.signing.outputs.available == 'true' &&
      (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      github.ref == 'refs/heads/preview')) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/preview') && 'preview' || 'production' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Determine build variant
        id: variant
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" = "refs/heads/preview" ]; then
            echo "tasks=:app:assembleDebug :app:bundleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
            {
              echo "upload_paths<<EOF"
              echo "app/build/outputs/apk/debug/*.apk"
              echo "app/build/outputs/bundle/debug/*.aab"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tasks=:app:assembleRelease :app:bundleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
            {
              echo "upload_paths<<EOF"
              echo "app/build/outputs/apk/release/*.apk"
              echo "app/build/outputs/bundle/release/*.aab"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Write google-services.json for this variant
        env:
          GOOGLE_SERVICE_JSON: ${{ vars.GOOGLE_SERVICE_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICE_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICE_JSON}" > app/google-services.json
            jq -e . app/google-services.json > /dev/null
          fi
      - name: Prepare Android signing key
        env:
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_ALIAS: ${{ vars.SIGNING_ALIAS }}
        run: |
          tr -d ' \n\r' <<< '${{ secrets.SIGNING_KEY_BASE64 || secrets.SIGNING_KEY }}' | base64 -d > ./.keystore
          STORE_PASS=$(tr -d '\n\r' <<< "${SIGNING_STORE_PASSWORD:-$SIGNING_PASS}")
          KEY_PASS=$(tr -d '\n\r' <<< "${SIGNING_KEY_PASSWORD:-$STORE_PASS}")
          DETECTED_ALIAS=$(keytool -list -keystore ./.keystore -storepass "${STORE_PASS}" 2>/dev/null | grep "Alias name:" | head -n1 | sed 's/.*Alias name: *//' | tr -d ' \r')
          KEY_ALIAS=$(tr -d '\n\r' <<< "${SIGNING_ALIAS:-${DETECTED_ALIAS:-release}}")
          {
            echo "signing.storePassword=${STORE_PASS}"
            echo "signing.keyPassword=${KEY_PASS}"
            echo "signing.Alias=${KEY_ALIAS}"
          } > ./local.properties
          keytool -list -v -keystore ./.keystore -storepass "${STORE_PASS}"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK and AAB
        env:
          SIGNING_KEY: ${{ runner.temp }}/android-release.jks
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
          VERSION_NAME: ${{ needs.release_please.outputs.version_name }}
          VERSION_CODE: ${{ needs.release_please.outputs.version_code }}
        run: |
          ./gradlew --no-daemon ${{ steps.variant.outputs.tasks }} \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" -Pdebuggable=false
      - name: Verify signed APK and report
        run: |
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
          APK=$(ls ${{ steps.variant.outputs.apk_dir }}/*.apk | head -n1)
          REPORT=${{ steps.variant.outputs.apk_dir }}/apksigner-report.txt
          set +e
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$REPORT" 2>&1
          STATUS=$?
          set -e
          {
            echo "## APK signature verification"
            echo '```'
            cat "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-signed-${{ github.sha }}
          path: ${{ steps.variant.outputs.upload_paths }}
          if-no-files-found: error
          retention-days: 14

  android-unsigned:
    name: Build unsigned APK and AAB
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/preview') && 'preview' || 'production' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Determine build variant
        id: variant
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" = "refs/heads/preview" ]; then
            echo "tasks=:app:assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
            {
              echo "upload_paths<<EOF"
              echo "app/build/outputs/apk/debug/*.apk"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tasks=:app:assembleRelease :app:bundleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
            {
              echo "upload_paths<<EOF"
              echo "app/build/outputs/apk/release/*.apk"
              echo "app/build/outputs/bundle/release/*.aab"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Write google-services.json for this variant
        env:
          GOOGLE_SERVICE_JSON: ${{ vars.GOOGLE_SERVICE_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICE_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICE_JSON}" > app/google-services.json
            jq -e . app/google-services.json > /dev/null
          fi

      - name: Compute build version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          SHORT_SHA=$(git rev-parse --short HEAD)
          {
            echo "version_name=${BASE_VERSION}-${SHORT_SHA}"
            echo "version_code=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned APK and AAB
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew --no-daemon ${{ steps.variant.outputs.tasks }} \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" -Pdebuggable=false

      - name: Verify APK signature
        run: |
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
          APK=$(ls ${{ steps.variant.outputs.apk_dir }}/*.apk | head -n1)
          REPORT=${{ steps.variant.outputs.apk_dir }}/apksigner-report.txt
          set +e
          "$APKSIGNER" verify --print-certs -v "$APK" > "$REPORT" 2>&1
          set -e
          {
            echo "## APK signature verification"
            echo '```'
            cat "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned-${{ github.sha }}
          path: ${{ steps.variant.outputs.upload_paths }}
          if-no-files-found: error
          retention-days: 14

  release-artifacts:
    name: Collect release artifacts
    needs:
      - android-signed
      - android-unsigned
    runs-on: ubuntu-latest
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-signed-${{ github.sha }}
          path: release-artifacts/signed
      - name: Download unsigned artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-unsigned-${{ github.sha }}
          path: release-artifacts/unsigned
      - name: Upload combined release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ github.sha }}
          path: release-artifacts/**
          if-no-files-found: error
          retention-days: 14

  google-play-release:
    name: Release to Google Play
    needs:
      - android-signed
      - release_please
      - signing
    runs-on: ubuntu-latest
    if: >-
      needs.signing.outputs.available == 'true' &&
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      github.ref == 'refs/heads/preview')
    concurrency:
      group: google-play-release
      cancel-in-progress: false
    environment:
      name: ${{ github.ref == 'refs/heads/preview' && 'preview' || 'production' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Determine bundle path
        id: bundle
        run: |
          if [ "${{ github.ref }}" = "refs/heads/preview" ]; then
            echo "path=app/build/outputs/bundle/debug/*.aab" >> "$GITHUB_OUTPUT"
          else
            echo "path=app/build/outputs/bundle/release/*.aab" >> "$GITHUB_OUTPUT"
          fi
      - name: Download signed release bundle
        uses: actions/download-artifact@v4
        with:
          name: android-release-signed-${{ github.sha }}
          path: app/build/outputs
      - name: Decode Google Play Service Account Key
        env:
          IAM_PRIVATE_KEY: ${{ secrets.IAM_PRIVATE_KEY }}
        run: |
          tr -d ' \n\r' <<< '${{ secrets.IAM_PRIVATE_KEY }}' | base64 -d > ./service-account.json
      - name: Prepare Google Play release notes
        env:
          BASE_VERSION: ${{ needs.release_please.outputs.base_version }}
        run: node .github/workflows/scripts/extract-release-notes.mjs CHANGELOG.md
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ./service-account.json
          packageName: ${{ vars.PACKAGE_NAME }}
          releaseFiles: ${{ steps.bundle.outputs.path }}
          tracks: internal
          releaseName: ${{ needs.release_please.outputs.version_name }}
          whatsNewDirectory: distribution/whatsnew

  github-release-assets:
    name: Attach APK files to the GitHub Release
    needs:
      - release_please
      - android-signed
      - android-unsigned
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-signed-${{ github.sha }}
          path: release-assets/signed

      - name: Download unsigned artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-unsigned-${{ github.sha }}
          path: release-assets/unsigned

      - name: Attach APK files to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: v${{ needs.release_please.outputs.base_version }}
        run: |
          if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "No GitHub Release for $TAG_NAME. Skipping."
            exit 0
          fi
          mapfile -t APK_FILES < <(find release-assets -name '*.apk' -type f)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "No APK files found in the build artifacts."
            exit 1
          fi
          gh release upload "$TAG_NAME" "${APK_FILES[@]}" --clobber
