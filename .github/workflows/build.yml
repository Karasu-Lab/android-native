name: Android Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-secrets:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      signing_key_available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check signing secrets
        id: check
        env:
          ANDROID_GPG_PRIVATE_KEY: ${{ secrets.ANDROID_GPG_PRIVATE_KEY }}
          ANDROID_GPG_PASSPHRASE: ${{ secrets.ANDROID_GPG_PASSPHRASE }}
          ANDROID_SIGNING_KEYSTORE_GPG: ${{ secrets.ANDROID_SIGNING_KEYSTORE_GPG }}
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Signing secrets are only used by builds of the main branch; this build will be unsigned."
            exit 0
          fi

          configured=0
          missing=()
          for value in \
            "$ANDROID_GPG_PRIVATE_KEY" \
            "$ANDROID_GPG_PASSPHRASE" \
            "$ANDROID_SIGNING_KEYSTORE_GPG" \
            "$SIGNING_PASS"; do
            if [ -n "$value" ]; then
              configured=$((configured + 1))
            fi
          done

          [ -n "$ANDROID_GPG_PRIVATE_KEY" ] || missing+=("ANDROID_GPG_PRIVATE_KEY")
          [ -n "$ANDROID_GPG_PASSPHRASE" ] || missing+=("ANDROID_GPG_PASSPHRASE")
          [ -n "$ANDROID_SIGNING_KEYSTORE_GPG" ] || missing+=("ANDROID_SIGNING_KEYSTORE_GPG")
          [ -n "$SIGNING_PASS" ] || missing+=("SIGNING_PASS")

          if [ "$configured" -eq 0 ]; then
            echo "Signing secrets are not configured; release artifacts will be unsigned."
            exit 0
          fi

          if [ "$configured" -ne 4 ]; then
            echo "::error::Configure all required Android signing secrets. Missing: ${missing[*]}."
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
        shell: bash

  android-signed:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    needs: signing-secrets
    if: needs.signing-secrets.outputs.signing_key_available == 'true'
    steps:
      - name: Prepare Android signing key
        env:
          ANDROID_GPG_PRIVATE_KEY: ${{ secrets.ANDROID_GPG_PRIVATE_KEY }}
          ANDROID_GPG_PASSPHRASE: ${{ secrets.ANDROID_GPG_PASSPHRASE }}
          ANDROID_SIGNING_KEYSTORE_GPG: ${{ secrets.ANDROID_SIGNING_KEYSTORE_GPG }}
          GNUPGHOME: ${{ runner.temp }}/android-gnupg
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$GNUPGHOME"

          private_key_file="$RUNNER_TEMP/android-gpg-private-key.asc"
          encrypted_keystore_file="$RUNNER_TEMP/android-release.jks.gpg"
          passphrase_file="$RUNNER_TEMP/android-gpg-passphrase"
          trap 'rm -f "$private_key_file" "$encrypted_keystore_file" "$passphrase_file"' EXIT

          printf '%s\n' "$ANDROID_GPG_PRIVATE_KEY" > "$private_key_file"
          gpg --batch --homedir "$GNUPGHOME" --import "$private_key_file"
          secret_keys="$(gpg --batch --homedir "$GNUPGHOME" --with-colons --list-secret-keys)"
          if ! grep -q '^sec:' <<< "$secret_keys"; then
            echo "::error::The configured GPG key could not be imported."
            exit 1
          fi

          printf '%s' "$ANDROID_GPG_PASSPHRASE" > "$passphrase_file"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_GPG" > "$encrypted_keystore_file"
          gpg --batch --homedir "$GNUPGHOME" --yes --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --output "$RUNNER_TEMP/android-release.jks" \
            --decrypt "$encrypted_keystore_file"
          test -s "$RUNNER_TEMP/android-release.jks"

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK and AAB
        env:
          SIGNING_KEY: ${{ runner.temp }}/android-release.jks
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/android-release.jks" \
            "$RUNNER_TEMP/android-release.jks.gpg" \
            "$RUNNER_TEMP/android-gpg-private-key.asc" \
            "$RUNNER_TEMP/android-gpg-passphrase"
          rm -rf "$RUNNER_TEMP/android-gnupg"

      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-signed-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  android-unsigned:
    name: Build unsigned release APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK and AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload unsigned release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
