name: Android Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-signed:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Check signing secrets
        id: check
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          configured=0
          missing=()
          for value in "$SIGNING_KEY" "$SIGNING_PASS"; do
            if [ -n "$value" ]; then
              configured=$((configured + 1))
            fi
          done

          [ -n "$SIGNING_KEY" ] || missing+=("SIGNING_KEY")
          [ -n "$SIGNING_PASS" ] || missing+=("SIGNING_PASS")

          if [ "$configured" -eq 0 ]; then
            echo "Signing secrets are not configured; release artifacts will be unsigned."
            exit 0
          fi

          if [ "$configured" -ne 2 ]; then
            echo "::error::Configure all required Android signing secrets. Missing: ${missing[*]}."
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Prepare Android signing key
        if: steps.check.outputs.available == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
          GNUPGHOME: ${{ runner.temp }}/android-gnupg
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$GNUPGHOME"

          encrypted_keystore_file="$RUNNER_TEMP/android-release.jks.gpg"
          passphrase_file="$RUNNER_TEMP/android-gpg-passphrase"
          trap 'rm -f "$encrypted_keystore_file" "$passphrase_file"' EXIT

          printf '%s' "$SIGNING_KEY" > "$encrypted_keystore_file"
          printf '%s' "$SIGNING_PASS" > "$passphrase_file"
          gpg --batch --homedir "$GNUPGHOME" --yes --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --output "$RUNNER_TEMP/android-release.jks" \
            --decrypt "$encrypted_keystore_file"
          test -s "$RUNNER_TEMP/android-release.jks"

      - name: Check out source
        if: steps.check.outputs.available == 'true'
        uses: actions/checkout@v7

      - name: Set up Java
        if: steps.check.outputs.available == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: steps.check.outputs.available == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        if: steps.check.outputs.available == 'true'
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        if: steps.check.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK and AAB
        if: steps.check.outputs.available == 'true'
        env:
          SIGNING_KEY: ${{ runner.temp }}/android-release.jks
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/android-release.jks" \
            "$RUNNER_TEMP/android-release.jks.gpg" \
            "$RUNNER_TEMP/android-gpg-passphrase"
          rm -rf "$RUNNER_TEMP/android-gnupg"

      - name: Upload signed release APK and AAB
        if: steps.check.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-release-signed-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  android-unsigned:
    name: Build unsigned release APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK and AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload unsigned release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
