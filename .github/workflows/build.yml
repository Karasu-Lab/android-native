name: Android Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpg:
    name: Import signing key
    runs-on: ubuntu-latest
    outputs:
      signing_key_available: ${{ steps.import.outputs.available }}
    steps:
      - name: Import GPG key when configured
        id: import
        env:
          ANDROID_GPG_PRIVATE_KEY: ${{ secrets.ANDROID_GPG_PRIVATE_KEY }}
          ANDROID_GPG_PASSPHRASE: ${{ secrets.ANDROID_GPG_PASSPHRASE }}
          ANDROID_SIGNING_KEYSTORE_GPG: ${{ secrets.ANDROID_SIGNING_KEYSTORE_GPG }}
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
          GNUPGHOME: ${{ runner.temp }}/android-gnupg
        run: |
          configured=0
          for value in \
            "$ANDROID_GPG_PRIVATE_KEY" \
            "$ANDROID_GPG_PASSPHRASE" \
            "$ANDROID_SIGNING_KEYSTORE_GPG" \
            "$SIGNING_PASS"; do
            if [ -n "$value" ]; then
              configured=$((configured + 1))
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "Signing secrets are not configured; release artifacts will be unsigned."
            exit 0
          fi

          if [ "$configured" -ne 4 ]; then
            echo "::error::Configure all Android signing secrets, or leave all of them unset."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Signing secrets are only used by builds of the main branch; this build will be unsigned."
            exit 0
          fi

          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$ANDROID_GPG_PRIVATE_KEY" | gpg --batch --import
          secret_keys="$(gpg --batch --with-colons --list-secret-keys)"
          if ! grep -q '^sec:' <<< "$secret_keys"; then
            echo "::error::The configured GPG key could not be imported."
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Package imported GPG state
        if: steps.import.outputs.available == 'true'
        run: |
          tar \
            --exclude='S.gpg-agent*' \
            --exclude='S.dirmngr' \
            --exclude='*.lock' \
            -C "$GNUPGHOME" \
            -czf "$RUNNER_TEMP/android-gpg-state.tar.gz" .
        env:
          GNUPGHOME: ${{ runner.temp }}/android-gnupg

      - name: Upload imported GPG state artifact
        if: steps.import.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-gpg-state
          path: ${{ runner.temp }}/android-gpg-state.tar.gz
          retention-days: 1

  android-signed:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    needs: gpg
    if: needs.gpg.outputs.signing_key_available == 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download imported GPG state
        if: needs.gpg.outputs.signing_key_available == 'true'
        uses: actions/download-artifact@v7
        with:
          name: android-gpg-state
          path: ${{ runner.temp }}

      - name: Restore imported GPG state
        if: needs.gpg.outputs.signing_key_available == 'true'
        run: |
          install -d -m 700 "$RUNNER_TEMP/android-gnupg"
          tar -xzf "$RUNNER_TEMP/android-gpg-state.tar.gz" -C "$RUNNER_TEMP/android-gnupg"
          chmod 700 "$RUNNER_TEMP/android-gnupg"

      - name: Decrypt Android signing files
        env:
          ANDROID_GPG_PASSPHRASE: ${{ secrets.ANDROID_GPG_PASSPHRASE }}
          ANDROID_SIGNING_KEYSTORE_GPG: ${{ secrets.ANDROID_SIGNING_KEYSTORE_GPG }}
          GNUPGHOME: ${{ runner.temp }}/android-gnupg
        run: |
          set -euo pipefail
          passphrase_file="$RUNNER_TEMP/android-gpg-passphrase"
          printf '%s' "$ANDROID_GPG_PASSPHRASE" > "$passphrase_file"
          chmod 600 "$passphrase_file"

          printf '%s' "$ANDROID_SIGNING_KEYSTORE_GPG" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passphrase_file" \
              --output "$RUNNER_TEMP/android-release.jks" --decrypt
          rm -f "$passphrase_file"
          test -s "$RUNNER_TEMP/android-release.jks"

      - name: Build signed release APK and AAB
        env:
          SIGNING_KEY: ${{ runner.temp }}/android-release.jks
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/android-release.jks" \
            "$RUNNER_TEMP/android-gpg-passphrase"
          rm -rf "$RUNNER_TEMP/android-gnupg"

      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-signed-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  android-unsigned:
    name: Build unsigned release APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK and AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload unsigned release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
