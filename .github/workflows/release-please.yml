name: Release Please

on:
  push:
    branches:
      - preview

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v5
        with:
          target-branch: preview
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
